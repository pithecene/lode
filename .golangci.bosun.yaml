version: "2"

# Bosun's Go analyzers, which the internal check runs on this module
# (bosun.yaml and CI's check job). The stock linters stay in .golangci.yaml,
# which CI's lint job runs. Lode leaves commentpolicy off: its caps of two
# lines on an exported declaration and four inline would cut the contract-style
# doc comments that AGENTS.md requires.
linters:
  default: none
  enable:
    - errjoin
    - mapboolset
    - osexitscope
    - spawnscope
    - testparallel
    - testtable
    - unused
    - useany
  settings:
    unused:
      field-writes-are-uses: false
    custom:
      mapboolset:
        type: module
      errjoin:
        type: module
      osexitscope:
        type: module
      spawnscope:
        type: module
      testparallel:
        type: module
        settings:
          serial-helper-packages:
            - github.com/pithecene/lode/internal/testutil
      testtable:
        type: module
        settings:
          serial-helper-packages:
            - github.com/pithecene/lode/internal/testutil
      useany:
        type: module

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
