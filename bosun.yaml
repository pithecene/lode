# Lode configures Bosun's checks (pithecene/bosun, CONTRACT_CONFIG): the release gate holds the changelog to the
# changelog contract, and the prose gate holds it to the prose contract, which the changelog contract applies to
# every entry. CI runs them in the changelog job of .github/workflows/check.yaml. Pithecene's layer, which this
# file extends, routes each change into its track's stack of pull requests.
version: 1
extends: ghcr.io/pithecene/bosun-config:v3
prose:
  documents:
    - CHANGELOG.md
    - docs/plans/V1_READINESS.md
changelog:
  file: CHANGELOG.md
# The check runs Bosun's Go analyzers that .golangci.bosun.yaml enables; the stock linters stay in .golangci.yaml.
go:
  modules:
    - dir: .
      config: .golangci.bosun.yaml
# Heavy commands wait while host load exceeds 1.5 per core or available memory drops below 4 GiB.
resources:
  processor:
    load: 1.5
  memory:
    min_available: 4294967296
