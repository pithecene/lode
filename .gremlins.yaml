# yaml-language-server: $schema=https://gremlins.dev/0.6/schema/configuration.json
#
# Mutation testing configuration (task mutate / nightly 🧬 job).
# Thresholds are quality gates: gremlins exits non-zero below them.
# They are set just under the measured baseline so regressions fail the
# nightly run while equivalent mutants do not.
unleash:
  # Bounded so concurrent test processes fit a 4-vCPU CI runner. Unbounded
  # workers each spawn a test process that uses every CPU; the resulting
  # contention shows up as TIMED OUT mutants, which the thresholds below do
  # not count.
  #
  # Do not set test-cpu. gremlins v0.6.0 passes it to go test as the single
  # argument "-cpu N" (go-gremlins/gremlins#272); go test then exits 1 for
  # every mutant, which gremlins records as KILLED, and the run reports 100%
  # efficacy without testing anything. Fixed upstream in #273, unreleased.
  workers: 2
  # The default timeout is a small multiple of the baseline test time (~0.1s),
  # which times out most mutants instead of killing them. 20x gives a real verdict.
  timeout-coefficient: 20
  exclude-files:
    - examples/
  # Baseline (2026-10-18, gremlins v0.6.0, ./lode incl. s3, after the v0.10.0
  # hardening pass): killed 660, lived 77, not covered 29, timed out 3 →
  # efficacy 89.55%, mutant coverage 96.21%. The pre-hardening baseline was
  # 80.91% / 93.67%. Every remaining LIVED mutant is either documented as
  # equivalent in the test file header next to the code it mutates, or needs
  # multi-TB inputs (S3 object-size and part-scaling bounds). Gates sit one
  # point under baseline; raise as tests improve.
  #
  # gremlins v0.6.0 fails when actual <= threshold (report.go assess), so a
  # value of 88 means "fail below 89" and 95 means "fail below 96".
  #
  # Known limitation (go-gremlins/gremlins#298, open, no released fix): case
  # expressions of tagless switches are reported NOT COVERED and their mutants
  # never run. This repo uses that form for the CAS decision in
  # lode/store.go (writeLatestPointer path) and lode/store_cas_unix.go, so those
  # guards are under-measured. The baseline above already includes them as
  # NOT COVERED. Revisit when a tagged release carries the fix; the repo pins
  # tagged tool versions only.
  threshold:
    efficacy: 88
    mutant-coverage: 95
