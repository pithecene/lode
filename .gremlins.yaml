# yaml-language-server: $schema=https://gremlins.dev/0.6/schema/configuration.json
#
# Mutation testing configuration (task mutate / nightly 🧬 job).
# Thresholds are quality gates: gremlins exits non-zero below them.
# They are set just under the measured baseline so regressions fail the
# nightly run while equivalent mutants do not.
unleash:
  # Bounded so concurrent test processes fit a 4-vCPU CI runner. Unbounded
  # workers each spawn a test process that uses every CPU; the resulting
  # contention shows up as TIMED OUT mutants, which the thresholds below do
  # not count.
  #
  # Do not set test-cpu. gremlins v0.6.0 passes it to go test as the single
  # argument "-cpu N" (go-gremlins/gremlins#272); go test then exits 1 for
  # every mutant, which gremlins records as KILLED, and the run reports 100%
  # efficacy without testing anything. Fixed upstream in #273, unreleased.
  workers: 2
  # The default timeout is a small multiple of the baseline test time (~0.1s),
  # which times out most mutants instead of killing them. 20x gives a real verdict.
  timeout-coefficient: 20
  # The whole module is mutated: shared internals (internal/history,
  # internal/retry) carry logic lode depends on, and gremlins measures
  # coverage per package, so they are gated by their own tests. Excluded:
  # examples, internal/testutil (test doubles, not product code),
  # internal/chaos (the on-demand stress harness, not product code), and
  # files built only for Windows. gremlins mutates a file whatever its build
  # constraints, and the nightly run is on Linux, where a Windows-only file
  # is never compiled, so its mutants are reported NOT COVERED although the
  # Windows job of the CI test matrix runs the tests that cover it.
  exclude-files:
    - examples/
    - internal/testutil/
    - internal/chaos/
    - _windows\.go$
  # Baseline (2026-10-20, gremlins v0.6.0, whole module after the history
  # core, retry config and validation errors moved to internal/, produced by
  # `task mutate` with exactly this file — workers 2, timeout-coefficient 20,
  # no test-cpu — and reproduced exactly on a second run):
  # killed 575, lived 48, not covered 26, timed out 3 → efficacy 92.30%,
  # mutant coverage 95.99%. The four LIVED in internal/ are the equivalent
  # mutants documented in internal/history and internal/retry test headers.
  # Previous baseline (2026-10-19, ./lode incl. s3, v0.10.0 at 99cb592,
  # reproduced across four runs within ±5 lived): killed 555, lived 49, not
  # covered 26, timed out 4 → efficacy 91.89%, mutant coverage 95.87%. A run that reports ~1 lived and
  # 0 timed out is the vacuous `-cpu` mode described below, not a baseline. The mutant count fell from 769 to 634 with
  # the hygiene restructuring (less code, same behavior); the hardening pass
  # before it had taken efficacy from 80.91% / 93.67% to 89.55% / 96.21%.
  # Every remaining LIVED mutant is either documented as equivalent in the
  # test file header next to the code it mutates, needs multi-TB inputs (S3
  # object-size and part-scaling bounds), or sits in lode/s3/mock.go — the
  # S3 test double, exported from the built package for compatibility
  # (docs/V1_API_DECISIONS.md D7) and not chased. Gates sit under baseline;
  # raise as tests improve.
  #
  # gremlins v0.6.0 fails when actual <= threshold (report.go assess), so a
  # value of 88 means "fail below 89" and 95 means "fail below 96".
  #
  # Known limitation (go-gremlins/gremlins#298, open, no released fix): case
  # expressions of tagless switches are reported NOT COVERED and their mutants
  # never run. This repo uses that form for the CAS decision in
  # lode/store.go (writeLatestPointer path) and lode/store_cas.go, so those
  # guards are under-measured. The baseline above already includes them as
  # NOT COVERED. Revisit when a tagged release carries the fix; the repo pins
  # tagged tool versions only.
  threshold:
    efficacy: 88
    mutant-coverage: 95
