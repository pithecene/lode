<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "EBG"; src: url("fonts/EBGaramond.ttf"); }
@font-face { font-family: "EBGI"; src: url("fonts/EBGaramond-Italic.ttf"); }
html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
#wrap { position: relative; }
canvas { display: block; }
.t { position: absolute; white-space: nowrap; font-kerning: normal; font-feature-settings: "kern", "liga", "onum"; }
#word { font-family: "EBG"; font-weight: 400; letter-spacing: -0.012em; }
#tag { font-family: "EBGI"; }
#cap { font-family: "EBGI"; letter-spacing: 0.02em; }
#cap b { font-family: "EBG"; font-weight: 400; font-variant: small-caps; letter-spacing: 0.08em; font-style: normal; }
</style></head>
<body><div id="wrap"><canvas id="c"></canvas>
<div class="t" id="word">Lode</div>
<div class="t" id="tag">Structured persistence for object storage.</div>
<div class="t" id="cap"><b>Section A–A′</b> &nbsp;strata are snapshots · faults are partitions · the vein is the lode</div>
</div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;      // canvas pixels
uniform vec4 view;     // x0, y0, width, height of the window onto the section (section units: y 0..1 top-down, x 0..aspect)
uniform float dark;
uniform float seed;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21) + seed); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}
const mat2 R = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ v += a * noise(p); p = R * p; a *= 0.5; } return v; }
float ridged(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ float n = 1.0 - abs(2.0 * noise(p) - 1.0); v += a * n * n; p = R * p; a *= 0.5; } return v; }

const float CX = 1.78;                       // crest of the fold
float surface(float x){ return 0.71 - 0.45 * exp(-pow((x - CX) / 0.70, 2.0)) + 0.012 * sin(x * 3.1); }

// fault planes: slanted lines; rock right of each line drops by its throw
float faultShift(vec2 p){
  float s = 0.0;
  if (p.x - (0.98 + 0.16 * (p.y - 0.5)) > 0.0) s += 0.035;
  if (p.x - (2.12 - 0.12 * (p.y - 0.5)) > 0.0) s -= 0.028;
  return s;
}
float faultDist(vec2 p){
  float a = abs(p.x - (0.98 + 0.16 * (p.y - 0.5)));
  float b = abs(p.x - (2.12 - 0.12 * (p.y - 0.5)));
  return min(a, b);
}

// depth below the (folded, warped, faulted) surface
float depth(vec2 p){
  vec2 q = vec2(fbm(p * 1.3 + 3.1), fbm(p * 1.3 + 8.7));
  vec2 w = p + 0.08 * (q - 0.5);
  return w.y - surface(w.x) - faultShift(p) + 0.02 * (fbm(w * 4.0) - 0.5);
}

// the lode: a band at a fixed depth that thickens at the crest, plus ridged veinlets near it
float veinField(vec2 p){
  float d = depth(p);
  float crest = exp(-pow((p.x - CX) / 0.62, 2.0));
  float swell = 0.35 + 1.3 * smoothstep(0.25, 0.75, fbm(vec2(p.x * 2.4, 3.0)));
  float w = (0.004 + 0.030 * crest) * swell;
  float main = 1.0 - smoothstep(0.55, 1.0, abs(d - 0.15) / w);
  vec2 rp = p * vec2(2.6, 3.4) + 0.35 * vec2(fbm(p * 2.0), fbm(p * 2.0 + 4.0));
  float r = ridged(rp);
  float near = exp(-pow((d - 0.19) / 0.14, 2.0)) * (0.15 + 1.0 * crest);
  float lets = smoothstep(0.80, 0.90, r) * near;
  return clamp(main, 0.0, 1.0) * step(0.0, d);
}

vec3 rockColor(vec2 p, float d){
  float s = d * 15.0;
  float b = floor(s);
  float fr = fract(s);
  float h = hash(vec2(b, 7.0));
  vec3 a1, a2, tint;
  if (dark > 0.5){ a1 = vec3(0.105, 0.094, 0.078); a2 = vec3(0.300, 0.268, 0.222); tint = vec3(0.14, 0.19, 0.23); }
  else            { a1 = vec3(0.905, 0.878, 0.820); a2 = vec3(0.735, 0.690, 0.605); tint = vec3(0.76, 0.80, 0.81); }
  vec3 c = mix(a1, a2, h * 0.85);
  c = mix(c, tint, step(0.82, hash(vec2(b, 3.0))) * 0.55);
  // laminae: fine bedding inside each stratum, streaked along the layer
  float lam = 0.5 + 0.5 * sin(fr * 6.2832 * (3.0 + floor(h * 4.0)) + fbm(p * vec2(18.0, 3.0)) * 4.0);
  c *= 0.92 + 0.10 * lam;
  // streaky texture along the bedding
  c *= 0.90 + 0.18 * fbm(vec2(p.x * 22.0, d * 160.0));
  // bedding planes
  float edge = smoothstep(0.0, 0.05, fr) * smoothstep(1.0, 0.94, fr);
  c *= mix(dark > 0.5 ? 0.62 : 0.80, 1.0, edge);
  return c;
}

vec3 oreColor(vec2 p, float m){
  vec3 lo = dark > 0.5 ? vec3(0.50, 0.27, 0.12) : vec3(0.52, 0.28, 0.12);
  vec3 mid = dark > 0.5 ? vec3(0.86, 0.60, 0.30) : vec3(0.78, 0.52, 0.24);
  vec3 hi = vec3(1.0, 0.92, 0.74);
  float g = fbm(p * vec2(9.0, 30.0));
  vec3 c = mix(lo, mid, smoothstep(0.25, 0.75, g));
  c = mix(c, hi, smoothstep(0.72, 0.9, g) * 0.6);
  return c;
}

void main(){
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = vec2(view.x + uv.x * view.z, view.y + (1.0 - uv.y) * view.w);
  float px = view.w / res.y;              // one pixel in section units
  float d = depth(p);

  // ground above the rock: paper or night, with a whisper of texture
  vec3 voidTop = dark > 0.5 ? vec3(0.075, 0.069, 0.060) : vec3(0.957, 0.945, 0.913);
  vec3 voidBot = dark > 0.5 ? vec3(0.098, 0.090, 0.077) : vec3(0.930, 0.912, 0.870);
  vec3 col = mix(voidTop, voidBot, smoothstep(0.0, 0.7, p.y));
  col *= 0.985 + 0.03 * fbm(p * 6.0);

  if (d > 0.0){
    vec3 rock = rockColor(p, d);
    // weathered surface: a darker rind just under the top edge
    rock *= mix(dark > 0.5 ? 0.75 : 0.88, 1.0, smoothstep(0.0, 0.02, d));
    col = rock;
  }
  // the ground line itself, drawn like a section's surface stroke
  float gl = 1.0 - smoothstep(0.6 * px, 2.2 * px, abs(d));
  col = mix(col, dark > 0.5 ? vec3(0.80, 0.76, 0.68) : vec3(0.16, 0.14, 0.12), gl * 0.85);

  // faults: hairline, slightly crushed rock beside it
  if (d > -0.01){
    float fd = faultDist(p);
    col *= mix(dark > 0.5 ? 0.80 : 0.86, 1.0, smoothstep(0.0, 0.012, fd) );
    col = mix(col, dark > 0.5 ? vec3(0.70, 0.66, 0.58) : vec3(0.22, 0.19, 0.16), (1.0 - smoothstep(0.5 * px, 1.6 * px, fd)) * 0.55 * smoothstep(-0.01, 0.01, d));
  }

  // the vein, lit: normal from the vein field, light from the upper left
  float m = veinField(p);
  if (m > 0.001){
    float e = 2.0 * px;
    float hx = veinField(p + vec2(e, 0.0)) - veinField(p - vec2(e, 0.0));
    float hy = veinField(p + vec2(0.0, e)) - veinField(p - vec2(0.0, e));
    vec3 n = normalize(vec3(-hx, hy, 0.35));
    vec3 L = normalize(vec3(-0.5, 0.7, 0.6));
    float diff = clamp(dot(n, L), 0.0, 1.0);
    float spec = pow(clamp(dot(reflect(-L, n), vec3(0,0,1)), 0.0, 1.0), 24.0);
    vec3 ore = oreColor(p, m) * (0.55 + 0.6 * diff) + vec3(1.0, 0.93, 0.78) * spec * 0.55;
    // sparkle: native metal catching light
    float sp = step(0.9988, hash(floor(gl_FragCoord.xy / 2.0))) * m;
    col = mix(col, ore, smoothstep(0.0, 0.6, m));
  }
  // glow around the lode on the dark ground
  if (dark > 0.5 && d > 0.0){
    float crest = exp(-pow((p.x - CX) / 0.62, 2.0));
    float g = exp(-abs(d - 0.15) * 38.0) * (0.25 + 0.75 * crest);
    col += vec3(0.85, 0.50, 0.22) * g * 0.10;
  }

  // risograph grain and a soft vignette
  float gr = hash(gl_FragCoord.xy * 0.731 + 11.0) - 0.5;
  col += gr * (dark > 0.5 ? 0.035 : 0.028);
  vec2 v = uv - 0.5;
  col *= 1.0 - (dark > 0.5 ? 0.30 : 0.10) * dot(v * vec2(0.8, 1.2), v * vec2(0.8, 1.2));
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
const mode = (location.hash || "#dark").slice(1);           // dark | light | mark-dark | mark-light
const dark = mode.indexOf("dark") >= 0;
const isMark = mode.startsWith("mark");
const S = 2;                                                 // render scale
const W = isMark ? 512 : 1280, H = isMark ? 512 : 520;
const cv = document.getElementById("c");
cv.width = W * S; cv.height = H * S; cv.style.width = W * S + "px"; cv.style.height = H * S + "px";
const gl = cv.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
const vs = "attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }";
function sh(t, src){ const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { document.title = "ERR " + gl.getShaderInfoLog(s); throw new Error(gl.getShaderInfoLog(s)); } return s; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, "res"), cv.width, cv.height);
// the section window: full banner, or a square around the crest for the mark
const view = isMark ? [1.34, 0.14, 0.66, 0.66] : [0, 0, 1280 / 520, 1];
gl.uniform4f(gl.getUniformLocation(pr, "view"), ...view);
gl.uniform1f(gl.getUniformLocation(pr, "dark"), dark ? 1 : 0);
gl.uniform1f(gl.getUniformLocation(pr, "seed"), 0.137);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

const ink = dark ? "#f1ece2" : "#1c1a16", soft = dark ? "rgba(225,214,196,.78)" : "rgba(52,45,37,.80)", faint = dark ? "rgba(205,194,176,.48)" : "rgba(52,45,37,.52)";
function place(id, x, y, size, color){ const e = document.getElementById(id); e.style.left = x * S + "px"; e.style.top = y * S + "px"; e.style.fontSize = size * S + "px"; e.style.color = color; e.style.lineHeight = 1; }
if (isMark) { for (const id of ["word", "tag", "cap"]) document.getElementById(id).remove(); }
else {
  place("word", 86, 70, 212, ink);
  place("tag", 96, 274, 27, soft);
  place("cap", 828, 34, 13.5, faint);
}
document.fonts.ready.then(() => { document.title = "READY"; });
</script>
</body></html>
