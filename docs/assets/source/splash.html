<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "EBG"; src: url("fonts/EBGaramond.ttf"); font-weight: 400 800; }
@font-face { font-family: "EBG"; src: url("fonts/EBGaramond-Italic.ttf"); font-style: italic; font-weight: 400 800; }
:root { --bg: #f3efe7; --ink: #1a1815; --soft: #5d5447; --rule: #1a1815; --ore: #b4622a; }
html.dark { --bg: #121110; --ink: #ede7db; --soft: #a69a87; --rule: #ede7db; --ore: #d48a4c; }
html, body { margin: 0; background: var(--bg); }
.plate { width: 1280px; height: 400px; position: relative; background: var(--bg); color: var(--ink);
  font-family: "EBG", Georgia, serif; font-kerning: normal; font-feature-settings: "kern", "liga", "onum"; overflow: hidden; }
.sc { font-variant: small-caps; font-feature-settings: "kern", "lnum"; text-transform: lowercase; letter-spacing: .16em; font-size: 15px; color: var(--soft); }
.top, .foot { position: absolute; left: 96px; right: 96px; display: flex; justify-content: space-between; align-items: baseline; }
.top { top: 44px; }
.foot { bottom: 40px; }
.num { font-variant: normal; text-transform: none; font-feature-settings: "kern", "lnum"; letter-spacing: .12em; font-size: 13.5px; }
.rule { position: absolute; left: 96px; right: 96px; height: 1px; background: var(--rule); opacity: .9; }
.rule.a { top: 74px; } .rule.b { bottom: 72px; }
.main { position: absolute; left: 268px; top: 100px; height: 228px; display: flex; align-items: center; }
.mark { position: absolute; left: 96px; top: 147px; width: 128px; height: 103px; display: grid; grid-template-rows: repeat(11, 1fr); }
.mark i { display: block; align-self: center; height: 1.5px; background: var(--ink); opacity: .82; }
.mark i.ore { height: 9px; background: var(--ore); opacity: 1; }
.word { display: grid; gap: 2px; }
.word h1 { margin: 0; font-weight: 400; font-size: 156px; line-height: .86; letter-spacing: -.018em; }
.word p { margin: 0 0 0 6px; font-style: italic; font-size: 27px; color: var(--soft); letter-spacing: .005em; }
</style></head>
<body><div class="plate">
  <div class="top"><span class="sc">An embeddable Go library</span><span class="sc">Pithecene · <span class="num">v0.10</span></span></div>
  <div class="rule a"></div>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="ore"></i><i></i><i></i><i></i></div>
  <div class="main">
        <div class="word"><h1>Lode</h1><p>Structured persistence for object storage.</p></div>
  </div>
  <div class="rule b"></div>
  <div class="foot"><span class="sc">Datasets · Volumes · Snapshots · Manifests</span><span class="sc">Immutable by construction</span></div>
</div>
<script>if (location.hash === "#dark") document.documentElement.classList.add("dark");</script>
</body></html>
