# Docker Compose for S3-compatible integration tests
#
# Usage:
#   docker compose -f lode/s3/docker-compose.yaml up -d --wait
#   go test -v ./lode/s3/... -integration
#   docker compose -f lode/s3/docker-compose.yaml down

services:
  localstack:
    image: localstack/localstack:4.3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO no longer publishes its server image (Docker Hub or quay.io).
  # RustFS honors the conditional writes Lode relies on (If-None-Match and
  # If-Match on PutObject, If-None-Match on CompleteMultipartUpload) and
  # applies If-Match atomically under concurrent writers. SeaweedFS 3.97 was
  # rejected: it accepts several concurrent If-Match writes of one ETag.
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
