version: "3"

tasks:
  format:
    desc: Format and auto-fix code
    aliases: [fmt]
    cmds:
      - golangci-lint run --fix ./...

  lint:
    desc: Run linters (no fixes)
    cmds:
      - golangci-lint run ./...
      - yamllint -s .

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race -count=1 ./...

  gates:
    desc: Report the allocation-gate ceilings that the current code calls for
    set: [pipefail]
    cmds:
      - >-
        go test ./lode ./lode/volume -run TestAllocationGates -count=3 -v
        | grep -E '^=== RUN|measured ceilings|FAIL'

  fuzz:
    desc: Run every fuzz target for FUZZTIME each (default 30s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - ./scripts/fuzz.sh {{.FUZZTIME}}

  chaos:
    desc: Run the chaos harness (BACKENDS, LAYOUTS, FAULTS, RETENTION, VOLUME, DURATION, WRITERS, SEED, MEMPROFILE)
    vars:
      BACKENDS: '{{.BACKENDS | default "memory,fs"}}'
      LAYOUTS: '{{.LAYOUTS | default "default,hive"}}'
      FAULTS: '{{.FAULTS | default "none,mild"}}'
      RETENTION: '{{.RETENTION | default "false"}}'
      VOLUME: '{{.VOLUME | default "false"}}'
      DURATION: '{{.DURATION | default "30s"}}'
      WRITERS: '{{.WRITERS | default "8"}}'
      SEED: '{{.SEED | default "0"}}'
      MEMPROFILE: '{{.MEMPROFILE | default ""}}'
    cmds:
      - >-
        go test ./internal/chaos -run TestChaos -count=1 -v -timeout 0 -chaos
        -chaos.backends={{shellQuote .BACKENDS}} -chaos.layouts={{shellQuote .LAYOUTS}}
        -chaos.faults={{shellQuote .FAULTS}}
        -chaos.retention={{shellQuote .RETENTION}} -chaos.volume={{shellQuote .VOLUME}}
        -chaos.duration={{shellQuote .DURATION}} -chaos.writers={{shellQuote .WRITERS}}
        -chaos.seed={{shellQuote .SEED}} -chaos.memprofile={{shellQuote .MEMPROFILE}}

  mutate:
    desc: Run mutation tests on the module (lode, internal; gremlins; config in .gremlins.yaml)
    cmds:
      - gremlins unleash .

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  examples:
    desc: Build and run examples
    cmds:
      - go run ./examples/default_layout
      - go run ./examples/hive_layout
      - go run ./examples/blob_upload
      - go run ./examples/manifest_driven
      - go run ./examples/stream_write_records
      - go run ./examples/parquet
      - go run ./examples/optimistic_concurrency
      - go run ./examples/volume_sparse
      - go run ./examples/vector_artifacts
      - go run ./examples/retention

  snippets:
    desc: Verify runnable markdown snippets
    cmds:
      - ./scripts/verify-snippets.sh

  s3:up:
    desc: Start S3-compatible test services (LocalStack + RustFS)
    cmds:
      - docker compose -f lode/s3/docker-compose.yaml up -d --wait

  s3:down:
    desc: Stop S3-compatible test services
    cmds:
      - docker compose -f lode/s3/docker-compose.yaml down

  integration:
    desc: Run integration tests (requires s3:up first)
    cmds:
      - go test -v -count=1 ./lode/s3/... -integration

  bench:
    desc: Run all benchmarks (start s3:up first for S3 benchmarks)
    cmds:
      - go test -bench=. -benchmem -run=^$ ./lode/...
      - go test -bench=. -benchmem -run=^$ ./lode/s3/... -integration

  bench:stat:
    desc: Run benchmarks with -count=10 and pipe through benchstat
    set: [pipefail]
    cmds:
      - go test -bench=. -benchmem -count=10 -run=^$ ./lode/... | tee bench-inmemory.txt
      - go test -bench=. -benchmem -count=10 -run=^$ ./lode/s3/... -integration | tee bench-s3.txt
      - benchstat bench-inmemory.txt
      - benchstat bench-s3.txt

  bench:compare:
    desc: Compare two benchmark result files with benchstat
    cmds:
      - benchstat {{.CLI_ARGS}}
