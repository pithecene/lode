name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test (${{ matrix.os }})
    strategy:
      # A failure on one platform must not cancel the others: each result is
      # needed to tell a platform-specific defect from a general one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2
        with:
          # Only the tools the tests need, so that an unrelated tool cannot
          # fail the setup on one platform.
          install_args: go aqua:go-task/task

      - name: 🧪 Test
        run: task test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Examples
        run: task examples

  changelog:
    name: 🧾 Changelog
    # The release check is private to the maintainers. GitHub withholds the
    # deploy key from pull requests that forks and Dependabot open, so those
    # pull requests create no job rather than a job that fails for want of it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      # The commit of the release check that Lode adopts. Moving the pin adopts
      # any revised rule.
      BOSUN_REVISION: 34c156de5591e7d9327b5aa2790803f3257d7a8f
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 📥 Checkout Release Check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: pithecene/bosun
          ref: ${{ env.BOSUN_REVISION }}
          ssh-key: ${{ secrets.BOSUN_DEPLOY_KEY }}
          persist-credentials: false
          path: .bosun-source

      - name: 🧰 Setup Rust
        # The check builds with the Rust version that its own repository pins,
        # installed by the runner's rustup rather than by a third-party action.
        run: |
          version=$(awk -F'"' '/^rust = /{print $2}' .bosun-source/mise.toml)
          rustup toolchain install "$version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: 🏗️ Install Release Check
        run: .bosun-source/tools/install/install.sh .bosun-source .bosun release-gate

      - name: 🧾 Check Changelog
        run: .bosun/bin/release-gate check CHANGELOG.md

  snippets:
    name: 📝 Snippets
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📝 Verify Snippets
        run: task snippets
