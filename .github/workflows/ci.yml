name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test (${{ matrix.os }})
    strategy:
      # A failure on one platform must not cancel the others: each result is
      # needed to tell a platform-specific defect from a general one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2
        with:
          # Only the tools the tests need, so that an unrelated tool cannot
          # fail the setup on one platform.
          install_args: go aqua:go-task/task

      - name: 🧪 Test
        run: task test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Examples
        run: task examples

  changelog:
    name: 🧾 Changelog
    # The release check is private to the maintainers. A pull request that a
    # fork or Dependabot opens creates no job, rather than a job that fails
    # for want of access to the check.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 🧾 Check Changelog
        uses: ./.github/actions/release-check
        with:
          registry-user: ${{ secrets.BOSUN_REGISTRY_USER }}
          registry-token: ${{ secrets.BOSUN_REGISTRY_TOKEN }}
          run: bosun check

  snippets:
    name: 📝 Snippets
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📝 Verify Snippets
        run: task snippets
