name: 🌙 Nightly

on:
  schedule:
    - cron: 0 4 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: 🧪 Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🧪 Race Tests
        run: task test:race

  mutation:
    name: 🧬 Mutation Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🧬 Mutation Tests
        run: task mutate

  fuzz:
    name: 🔀 Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🔀 Fuzz Tests
        run: task fuzz FUZZTIME=60s

  integration:
    name: 🔌 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 🐳 Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ hashFiles('lode/s3/docker-compose.yaml') }}

      - name: 🐳 Load cached images
        run: |
          if [ -f /tmp/docker-images/images.tar ]; then
            docker load -i /tmp/docker-images/images.tar
          fi

      - name: 🐳 Start S3 Services
        run: task s3:up

      - name: 🐳 Save Docker images
        run: |
          mkdir -p /tmp/docker-images
          docker save $(docker compose -f lode/s3/docker-compose.yaml config --images) -o /tmp/docker-images/images.tar

      - name: 🧪 Integration Tests
        run: task integration

      - name: 📊 Benchmarks
        run: task bench:stat

      - name: 🐳 Stop S3 Services
        if: always()
        run: task s3:down
