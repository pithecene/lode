name: 📦 Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  tag_check:
    name: 🔎 Tag Check
    runs-on: ubuntu-latest
    outputs:
      semver_match: ${{ steps.regex-match.outputs.match }}
    steps:
      - name: 🔎 Match SemVer Tag
        uses: actions-ecosystem/action-regex-match@v2
        id: regex-match
        with:
          text: ${{ github.ref_name }}
          regex: ^v[0-9]+\.[0-9]+\.[0-9]+$

  release_check:
    name: 🧾 Release Check
    runs-on: ubuntu-latest
    needs: [tag_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    permissions:
      contents: read
      # The job pulls the internal check's image from the organization's registry.
      packages: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 🏷️ Fetch Annotated Tag
        # actions/checkout replaces an annotated tag with a lightweight one,
        # which has no message, so the workflow fetches the tag object again.
        run: git fetch --quiet --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: 📝 Extract Release Notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" release-notes.md

      - name: 🧾 Check Changelog and Release Notes
        uses: ./.github/actions/release-check
        with:
          token: ${{ github.token }}
          run: >-
            release-gate check CHANGELOG.md &&
            release-gate notes release-notes.md

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: [tag_check, release_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Package
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --output="dist/lode-${VERSION}.tar.gz" HEAD
          sha256sum "dist/lode-${VERSION}.tar.gz" > "dist/lode-${VERSION}.tar.gz.sha256"

      - name: ⬆️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  hold:
    name: ⏸️ Release Approval
    runs-on: ubuntu-latest
    needs: [package]
    environment:
      name: release
    steps:
      - name: ✅ Await Approval
        run: echo "Release approved; continuing."

  release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-latest
    needs: [hold]
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 🏷️ Fetch Annotated Tag
        run: git fetch --quiet --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: 📝 Extract Release Notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" release-notes.md

      - name: ⬇️ Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          draft: true
          files: dist/*
