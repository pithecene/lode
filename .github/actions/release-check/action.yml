name: Release Check
description: >-
  Installs the organization's internal release check at .bosun/bin/release-gate
  from the commit that this action pins. Moving the pin adopts any revised rule.

inputs:
  ssh-key:
    description: The read-only deploy key that checks out the release check.
    required: true

runs:
  using: composite
  steps:
    - name: 📥 Checkout Release Check
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        repository: pithecene/bosun
        # The changelog job of ci.yml runs the same commit; move both together.
        ref: 48e4ea345d86e0fb0b9f7054847603aa06182e34
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
        path: .bosun-source

    - name: 🧰 Setup Rust
      # The check builds with the Rust version that its own repository pins,
      # installed by the runner's rustup rather than by a third-party action.
      shell: bash
      run: |
        version=$(awk -F'"' '/^rust = /{print $2}' .bosun-source/mise.toml)
        rustup toolchain install "$version" --profile minimal
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

    - name: 🏗️ Install Release Check
      shell: bash
      run: .bosun-source/tools/install/install.sh .bosun-source .bosun release-gate
