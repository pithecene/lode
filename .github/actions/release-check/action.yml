name: Release Check
description: >-
  Runs a command in the organization's internal check image, which
  BOSUN_IMAGE in mise.toml pins by version and digest. Moving the pin adopts
  any revised rule. A read-only registry token pulls the private image.

inputs:
  registry-user:
    description: The account that owns the registry token.
    required: true
  registry-token:
    description: A read-only token for the organization's registry, which pulls the image.
    required: true
  run:
    description: The command to run in the image on the checkout.
    required: true

runs:
  using: composite
  steps:
    - name: 🧾 Run the Release Check
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        COMMAND: ${{ inputs.run }}
      run: |
        set -euo pipefail
        image="$(sed -n 's/^BOSUN_IMAGE = "\(.*\)"$/\1/p' mise.toml)"
        [ -n "$image" ] || { echo "mise.toml pins no BOSUN_IMAGE" >&2; exit 1; }
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
        docker run --rm -v "$GITHUB_WORKSPACE:/work" -e GITHUB_ACTIONS -e GITHUB_ACTOR \
          --entrypoint sh "$image" -c "$COMMAND"
